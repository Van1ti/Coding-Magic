<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div class="header_main">
            <div class="header_main--container">
                <img src="./img/logo.svg" alt="logo">
                <div class="header_main--container--box">
                    <div class="header_main--container--box--dropdown">
                        <button class="header_main--container--box--dropdown--btn" id="dropdownBtn">
                            Інтерактив <span class="header_main--container--box--dropdown--btn--arrow"><svg width="10"
                                    height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9.375 0.375L4.875 5.375L0.375 0.375" stroke="black" stroke-width="0.75"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg></span>
                        </button>

                        <div class="header_main--container--box--dropdown--menu" id="dropdownMenu">
                            <a href="#">Числовий</a>
                            <a href="#">Ігровий</a>
                            <a href="#">Ознайомчий</a>
                        </div>
                    </div>
                    <div class="header_main--container--box--nav">
                        <a href="#">Наша команда</a>
                        <a href="#">Контакти</a>
                    </div>
                </div>
            </div>
            <div class="header_main--configuration">
                <label class="theme-switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="theme-switch__slider">
                        <span class="theme-switch__circle">
                            <!-- Иконка Солнца -->
                            <svg class="theme-switch__icon theme-switch__icon--sun" width="14" height="14"
                                viewBox="0 0 14 14" fill="none">
                                <!-- Центральный черный круг -->
                                <circle cx="7" cy="7" r="3" fill="black" />
                                <!-- 8 треугольных лучей вокруг -->
                                <path d="M7 0.5L8 2.5H6L7 0.5Z" fill="black" />
                                <path d="M7 13.5L8 11.5H6L7 13.5Z" fill="black" />
                                <path d="M13.5 7L11.5 8V6L13.5 7Z" fill="black" />
                                <path d="M0.5 7L2.5 8V6L0.5 7Z" fill="black" />
                                <path d="M11.6 2.4L10.9 4.3L9.7 3.1L11.6 2.4Z" fill="black" />
                                <path d="M2.4 11.6L3.1 9.7L4.3 10.9L2.4 11.6Z" fill="black" />
                                <path d="M11.6 11.6L9.7 10.9L10.9 9.7L11.6 11.6Z" fill="black" />
                                <path d="M2.4 2.4L4.3 3.1L3.1 4.3L2.4 2.4Z" fill="black" />
                            </svg>


                            <!-- Иконка Луны -->
                            <svg class="theme-switch__icon theme-switch__icon--moon" width="14" height="14"
                                viewBox="0 0 14 14" fill="none">
                                <!-- Черный полумесяц -->
                                <path d="M12.5 8.2A5.5 5.5 0 0 1 5.8 1.5A5.8 5.8 0 1 0 12.5 8.2Z" fill="black" />
                            </svg>

                        </span>
                    </span>
                </label>

                <h2 id="hello-user" class="header_main--configuration--hello">Вітаємо, User!</h2>

                <div id="modal_overlay" class="modal_overlay--hidden">
                    <div class="modal_card">
                        <button class="modal_close" id="modal-close">&times;</button>

                        <img class="modal_icon--sword" src="./img/sword 1.svg" alt="sword">
                        <img class="modal_icon--puzzle" src="./img/puzzle 1.svg" alt="puzzle">
                        <img class="modal_icon--tic-tac-toe" src="./img/tic-tac-toe 1.svg" alt="tic-tac-toe">
                        <img class="modal_icon--game-development" src="./img/game-development 1.svg"
                            alt="game-development">

                        <div id="modal-step-1" class="modal_step">
                            <h3 class="modal_title">Привіт!</h3>
                            <p class="modal_text">
                                Ви потрапили на сайт інтерактивних ігор та завдань.
                                Надіємось, що вам сподобається і ви отримаєте позитивні емоції!
                                Бажаємо Вам гарно провести час!
                            </p>

                            <label class="modal_label" for="user-name-input">Введіть своє ім'я:</label>
                            <input type="text" id="user-name-input" class="modal_input" placeholder="Ваше ім'я...">
                            <button id="save-name-btn" class="modal_btn">Зберегти</button>
                        </div>

                        <div id="modal-step-2" class="modal_step hidden">
                            <h3 class="modal_success--text">Дякую за підписку!</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <script src="./script.js"></script>
</body>

</html>
